# Builds and publishes a GitHub Release when a pull request is merged into main.
#
# The release is named after __version__ in src/hexdrop/__init__.py, so a merge
# only publishes when that version has no release yet. To skip a release, leave
# the version alone.
#
# pull_request_target, not pull_request: a merged pull request from a fork gets
# a read-only token under pull_request and could not publish. Nothing from an
# unmerged branch runs here: the job needs merged == true and checks out the
# merge commit.

name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

env:
  # Set to "false" once a full flash through the GUI is confirmed on a real
  # board, and remove the matching note from .github/release-header.md.
  PRERELEASE: "true"

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/hexdrop/__init__.py | tr -d '\r')
          if [ -z "$version" ]; then
            echo "Could not read __version__" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: python -m pip install -r requirements.txt

      - name: Build the package
        if: steps.version.outputs.exists == 'false'
        run: python build/package.py

      # After the build, so the tests that inspect the built folder run too.
      - name: Run the tests
        if: steps.version.outputs.exists == 'false'
        run: python -m pytest -q

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          # --generate-notes adds the merged pull requests after the header.
          gh release create "v$VERSION" "dist/HexDrop_v$VERSION.zip" \
            --target "$MERGE_SHA" \
            --title "HexDrop v$VERSION" \
            --notes-file .github/release-header.md \
            --generate-notes \
            "${flags[@]}"
